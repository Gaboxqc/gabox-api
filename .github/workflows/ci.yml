name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # `-r pyproject.toml` installs the declared dependencies without building
      # the project itself, which the flat layout does not support.
      - name: Install dependencies
        run: uv pip install --system -r pyproject.toml --extra dev

      - name: Lint
        run: ruff check .

      - name: Format
        run: black --check api tests main.py

      - name: Test
        run: pytest -q
