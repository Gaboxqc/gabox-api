[project]
name = "gabox-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn>=0.48.0",
    "sqlmodel>=0.0.38",
    "sqlalchemy>=2.0.50",
    "psycopg2-binary>=2.9.12",
    "alembic>=1.18.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.7.0",
    # argon2id password hashing for admin login.
    "argon2-cffi>=25.1.0",
    # Imported directly by alembic/env.py, which stays independent of app settings.
    "python-dotenv>=1.2.2",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "black>=26.5.1",
    "ruff>=0.15.0",
    "pytest>=8.4.0",
    "pre-commit>=4.6.0",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Migration scripts are generated, and reformatting them would obscure the diff
# against what Alembic actually wrote.
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The project is a flat layout rather than an installed package, so the repo
# root has to be importable for `from main import app` to resolve.
pythonpath = ["."]